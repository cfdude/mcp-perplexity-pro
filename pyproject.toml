[project]
name = "mcp-perplexity-pro"
version = "2.0.0"
description = "MCP server for the Perplexity API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.11,<5",
    "sqlalchemy[asyncio]",
    "alembic",
    "aiosqlite",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_perplexity_pro"]
